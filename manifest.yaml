schema_version: 3

protocol:
  id: mind
  version: 1.0.0-rc.2

mind:
  name: mind@nilx-one
  context_version: 0.2.0
  subject:
    type: organization
    id: nilx-one
  owner:
    type: organization
    id: nilx-one

contract:
  canonical_source: required
  explicit_subject: required
  explicit_owner: required
  versioned_context: required
  human_readable: required
  machine_readable: required
  secrets: forbidden

modules:
  required:
    - identity
  registered:
    - identity
  rules:
    single_responsibility: required
    explicit_dependencies: required
    independently_replaceable: required
    duplicate_content: forbidden
    cross_reference: preferred
    composition_over_inheritance: preferred
  catalog:
    identity: modules/identity/module.yaml

context:
  stability:
    stable: long_lived_contracts
    transient: current_state
    archived: ignored_unless_requested
  visibility:
    repository: public
    allowed: durable_public_organization_context
    forbidden:
      - credentials
      - secrets
      - private_personal_data
      - private_infrastructure_state
      - transient_operational_state

loading:
  default:
    - identity
  optional: []

validation:
  schema: schema/mind.schema.json
  module_schema: schema/module.schema.json
